server:
  port: 8761                       # the standard Eureka port

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # This IS the registry, so it must not register with / fetch from itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Local development: start answering immediately and remove dead services quickly.
    # (Leave the defaults in production.)
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000
