# Integration tests (@ActiveProfiles("test")): in-memory H2 instead of MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:admin_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzJieXRlcyE=
    issuer: user-service

# Tests run without a Eureka server
eureka:
  client:
    enabled: false
