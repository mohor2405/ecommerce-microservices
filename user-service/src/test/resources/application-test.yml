# Used by integration tests (@ActiveProfiles("test")): in-memory H2 instead of MySQL,
# so tests run anywhere without a database server.
spring:
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Tests run without a Eureka server
eureka:
  client:
    enabled: false
